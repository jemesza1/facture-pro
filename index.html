  <!-- Public URL shows the landing. Merchants who already have data, an
       installed PWA, or ?app=1 skip it and land on the dashboard. -->
  <script>
  (function () {
    try {
      var q = location.search || '';
      var langM = /(?:^|[?&])lang=(ar|fr)(?:&|$)/.exec(q);
      if (langM) localStorage.setItem('fp_locale', langM[1]);
      if (/(?:^|[?&])app=1(?:&|$)/.test(q)) {
        localStorage.setItem('fp_entered', '1');
        /* "Commencer" landed on a dashboard of empty cards, and somebody who
           arrived to write one invoice had to find the button to write it.
           new=1 carries the intention through: the form is what opens. */
        if (/(?:^|[?&])new=1(?:&|$)/.test(q)) window.__fpNewInvoice = true;
        return;
      }
      if (localStorage.getItem('fp_entered') === '1') return;
      if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return;
      if (localStorage.getItem('facturepro_dz_v24')) return;
      var path = location.pathname || '/';
      if (path !== '/' && path !== '') return;
      location.replace('accueil.html');
    } catch (e) {}
  })();
  </script>

          b:"إذا مسحت ذاكرة التخزين أو استخدمت جهازاً آخر ستفقد بياناتك. صدّر نسخة JSON بانتظام.",
          c:"تصدير الآن", h:"لاحقاً", d:"احفظ في Drive"}
    };
    function paintWarn(){
      var l = (typeof locale !== 'undefined' && LW[locale]) ? locale : 'fr', d = LW[l];
      var q = function(id){ return document.getElementById(id); };
      if(q('lw-title')) q('lw-title').textContent = d.t;
      if(q('lw-body'))  q('lw-body').textContent  = d.b;
      if(q('lw-cta'))   q('lw-cta').textContent   = d.c;
      if(q('lw-hide'))  q('lw-hide').textContent  = d.h;
      /* The banner has always said "your data lives in this browser, export
         it". There is now somewhere for it to go, so the banner offers that
         too — this is the one place every merchant already reads. It appears
         only once drive.js has loaded and an OAuth client is configured;
         applyLocale repaints this notice, and by then it has. */
      var b = q('lw-drive');
      if (b) {
        var on = typeof driveConfigured === 'function' && driveConfigured();
        if (on) { q('lw-drive-label').textContent = d.d; b.classList.remove('hidden'); }
        else b.classList.add('hidden');
        try{ lucide.createIcons(); }catch(e){}
      }
    }
    /* Shown once to a browser that asks for neither French nor Arabic, and
       never again after it is closed. It is deliberately not a redirect: a
       guess about language is not grounds for moving somebody off the page
       they asked for. */
    function dismissForeign(){
      var el = document.getElementById('foreign-note');
      if (el) el.classList.add('hidden');
      try{ localStorage.setItem('fp_foreign_seen','1'); }catch(e){}
    }
    (function(){
      var seen = false;
      try{ seen = localStorage.getItem('fp_foreign_seen') === '1'; }catch(e){}
      var l = (navigator.language || '').toLowerCase();
      var speaksOurs = l.indexOf('fr') === 0 || l.indexOf('ar') === 0;
      if(!seen && !speaksOurs){
        var el = document.getElementById('foreign-note');
        if(el) el.classList.remove('hidden');
      }
    })();

    function dismissWarn(){
      var el = document.getElementById('local-warn');
      if(el) el.classList.add('hidden');
      try{ localStorage.setItem('fp_warn_seen','1'); }catch(e){}
    }
    (function(){
      var seen = false;
      try{ seen = localStorage.getItem('fp_warn_seen') === '1'; }catch(e){}
      if(!seen){
        var el = document.getElementById('local-warn');
        if(el) el.classList.remove('hidden');
      }
      paintWarn();
    })();
  </script>

  <!-- Vercel Web Analytics — counts page views only. Never touches invoice
       or client data, which stay in the visitor's own browser. -->
  <script>
    window.va = window.va || function () {
      (window.vaq = window.vaq || []).push(arguments);
    };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <!-- Installable, and usable with no signal. Registered after load so it
       never competes with the first paint, and failure is silent: a browser
       without service workers still gets the whole application. -->
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
