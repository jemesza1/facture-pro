<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>FacturePro Algérie | فاتورة برو</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 antialiased">
  <div id="app" class="flex h-screen overflow-hidden">
    <aside id="sidebar" class="w-64 bg-white dark:bg-slate-900 border-e border-slate-200 dark:border-slate-800 flex flex-col fixed inset-y-0 start-0 z-30 transform -translate-x-full md:translate-x-0 transition-transform duration-200">
      <div class="p-4 sm:p-5 border-b border-slate-200 dark:border-slate-800 flex items-center gap-3">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-lg shadow-brand-500/20">
          <i data-lucide="file-text" class="w-5 h-5 text-white"></i>
        </div>
        <div class="min-w-0">
          <h1 class="font-bold text-sm sm:text-base truncate">FacturePro</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">Algérie • Conforme</p>
        </div>
        <button onclick="toggleSidebar()" class="ms-auto md:hidden p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
        <button onclick="navigate('dashboard')" data-page="dashboard" class="nav-item active">
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i><span data-i18n="nav.dashboard">Tableau de bord</span>
        </button>
        <button onclick="navigate('invoices')" data-page="invoices" class="nav-item">
          <i data-lucide="receipt" class="w-5 h-5"></i><span data-i18n="nav.invoices">Factures</span>
        </button>
        <button onclick="navigate('clients')" data-page="clients" class="nav-item">
          <i data-lucide="users" class="w-5 h-5"></i><span data-i18n="nav.clients">Clients</span>
        </button>
        <button onclick="navigate('templates')" data-page="templates" class="nav-item">
          <i data-lucide="layout-template" class="w-5 h-5"></i><span data-i18n="nav.templates">Modèles</span>
        </button>
        <button onclick="navigate('settings')" data-page="settings" class="nav-item">
          <i data-lucide="settings" class="w-5 h-5"></i><span data-i18n="nav.settings">Paramètres</span>
        </button>
        <button onclick="navigate('help')" data-page="help" class="nav-item">
          <i data-lucide="help-circle" class="w-5 h-5"></i><span data-i18n="nav.help">Aide</span>
        </button>
        <button onclick="navigate('terms')" data-page="terms" class="nav-item">
          <i data-lucide="file-check" class="w-5 h-5"></i><span data-i18n="nav.terms">Conditions</span>
        </button>
      </nav>
      <div class="p-3 border-t border-slate-200 dark:border-slate-800">
        <button onclick="openNewInvoice()" class="btn-primary w-full">
          <i data-lucide="plus" class="w-4 h-4"></i> <span data-i18n="actions.newInvoice">Nouvelle facture</span>
        </button>
      </div>
      <div class="px-3 pb-3 text-center">
        <p class="text-[10px] text-slate-400 dark:text-slate-500 leading-relaxed">
          Created by <span class="font-semibold text-slate-600 dark:text-slate-300">CheMs SoUu</span>
        </p>
      </div>
    </aside>

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-20 hidden md:hidden" onclick="toggleSidebar()"></div>

    <div class="flex-1 flex flex-col min-w-0">
      <header class="h-14 sm:h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-3 sm:px-6 gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <h2 id="page-title" class="text-base sm:text-xl font-semibold truncate">Tableau de bord</h2>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" id="lang-toggle" onclick="toggleLocale()" class="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800" title="Language">العربية</button>
          <button onclick="toggleDark()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
            <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
            <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
          </button>
          <div class="w-8 h-8 rounded-full bg-brand-600 flex items-center justify-center text-white text-xs font-bold">DZ</div>
        </div>
      </header>
      <main id="main-content" class="flex-1 overflow-y-auto p-3 sm:p-6"></main>
    </div>
  </div>

  <div id="modal-root"></div>

  <div id="preview-root" class="hidden fixed inset-0 z-50 bg-slate-100 dark:bg-slate-950 flex flex-col">
    <div class="h-14 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 gap-2 shrink-0">
      <button onclick="closePreview()" class="btn-secondary">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> <span data-i18n="actions.back">Retour</span>
      </button>
      <div class="flex gap-2">
        <button onclick="downloadPdf()" class="btn-primary"><i data-lucide="download" class="w-4 h-4"></i> PDF</button>
        <button onclick="window.print()" class="btn-secondary"><i data-lucide="printer" class="w-4 h-4"></i></button>
      </div>
    </div>
    <div class="flex-1 overflow-y-auto p-4" id="preview-body"></div>
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      try { if (typeof applyLocale === 'function') applyLocale(); } catch (e) {}
      try { lucide.createIcons(); } catch (e) {}
    });
  </script>
</body>
</html>
