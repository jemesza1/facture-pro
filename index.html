<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FacturePro — Logiciel de facturation professionnel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 antialiased">
  <div id="app" class="flex h-screen overflow-hidden">
    <aside id="sidebar" class="w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col transition-all">
      <div class="p-5 border-b border-slate-200 dark:border-slate-800 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-lg shadow-brand-500/30">
          <i data-lucide="file-text" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg tracking-tight">FacturePro</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">Logiciel pro</p>
        </div>
      </div>
      <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
        <button onclick="navigate('dashboard')" data-page="dashboard" class="nav-item active">
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          <span>Tableau de bord</span>
        </button>
        <button onclick="navigate('invoices')" data-page="invoices" class="nav-item">
          <i data-lucide="receipt" class="w-5 h-5"></i>
          <span>Factures</span>
        </button>
        <button onclick="navigate('clients')" data-page="clients" class="nav-item">
          <i data-lucide="users" class="w-5 h-5"></i>
          <span>Clients</span>
        </button>
        <button onclick="navigate('templates')" data-page="templates" class="nav-item">
          <i data-lucide="layout-template" class="w-5 h-5"></i>
          <span>Modèles</span>
        </button>
        <button onclick="navigate('settings')" data-page="settings" class="nav-item">
          <i data-lucide="settings" class="w-5 h-5"></i>
          <span>Paramètres</span>
        </button>
      </nav>
      <div class="p-4 border-t border-slate-200 dark:border-slate-800">
        <button onclick="openNewInvoice()" class="w-full flex items-center justify-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 px-4 rounded-xl transition shadow-lg shadow-brand-600/25">
          <i data-lucide="plus" class="w-4 h-4"></i>
          Nouvelle facture
        </button>
      </div>
    </aside>
    <main class="flex-1 flex flex-col overflow-hidden">
      <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-6">
        <div class="flex items-center gap-3">
          <h2 id="page-title" class="text-xl font-semibold">Tableau de bord</h2>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="toggleDark()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition">
            <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
            <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
          </button>
          <div class="flex items-center gap-2 pl-3 border-l border-slate-200 dark:border-slate-700">
            <div class="w-8 h-8 rounded-full bg-brand-600 flex items-center justify-center text-white text-sm font-bold">FP</div>
            <span class="text-sm font-medium hidden sm:block">Mon entreprise</span>
          </div>
        </div>
      </header>
      <div id="page-content" class="flex-1 overflow-y-auto p-6"></div>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="invoice-preview" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm overflow-auto p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between p-4 border-b bg-slate-50">
        <h3 class="font-semibold">Aperçu de la facture</h3>
        <div class="flex gap-2">
          <button onclick="downloadPDF()" class="flex items-center gap-2 px-4 py-2 bg-brand-600 text-white rounded-lg hover:bg-brand-700 text-sm font-medium">
            <i data-lucide="download" class="w-4 h-4"></i> Télécharger PDF
          </button>
          <button onclick="closePreview()" class="p-2 hover:bg-slate-200 rounded-lg">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
      <div id="invoice-render" class="p-0 bg-white"></div>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initApp();
    });
  </script>
</body>
</html>
