<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>FacturePro Algérie</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 antialiased">
  <div id="app" class="flex h-screen overflow-hidden">
    <aside id="sidebar" class="w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col fixed inset-y-0 left-0 z-30 transform -translate-x-full md:translate-x-0 md:static transition-transform duration-200">
      <div class="p-4 sm:p-5 border-b border-slate-200 dark:border-slate-800 flex items-center gap-3">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-lg shadow-brand-500/20">
          <i data-lucide="file-text" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg tracking-tight">FacturePro</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">Algérie • Conforme</p>
        </div>
        <button onclick="toggleSidebar()" class="ml-auto md:hidden p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <nav class="flex-1 p-3 space-y-0.5 overflow-y-auto">
        <button onclick="navigate('dashboard')" data-page="dashboard" class="nav-item active">
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i><span>Tableau de bord</span>
        </button>
        <button onclick="navigate('invoices')" data-page="invoices" class="nav-item">
          <i data-lucide="receipt" class="w-5 h-5"></i><span>Factures</span>
        </button>
        <button onclick="navigate('clients')" data-page="clients" class="nav-item">
          <i data-lucide="users" class="w-5 h-5"></i><span>Clients</span>
        </button>
        <button onclick="navigate('templates')" data-page="templates" class="nav-item">
          <i data-lucide="layout-template" class="w-5 h-5"></i><span>Modèles</span>
        </button>
        <button onclick="navigate('settings')" data-page="settings" class="nav-item">
          <i data-lucide="settings" class="w-5 h-5"></i><span>Paramètres</span>
        </button>
        <button onclick="navigate('help')" data-page="help" class="nav-item">
          <i data-lucide="help-circle" class="w-5 h-5"></i><span>Aide</span>
        </button>
        <button onclick="navigate('terms')" data-page="terms" class="nav-item">
          <i data-lucide="file-check" class="w-5 h-5"></i><span>Conditions</span>
        </button>
      </nav>
      <div class="p-3 border-t border-slate-200 dark:border-slate-800">
        <button onclick="openNewInvoice()" class="w-full flex items-center justify-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 px-4 rounded-xl transition text-sm">
          <i data-lucide="plus" class="w-4 h-4"></i> Nouvelle facture
        </button>
      </div>
    </aside>
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-20 hidden md:hidden" onclick="toggleSidebar()"></div>
    <main class="flex-1 flex flex-col overflow-hidden w-full">
      <header class="h-14 sm:h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-3 sm:px-6 shrink-0">
        <div class="flex items-center gap-2 sm:gap-3">
          <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <h2 id="page-title" class="text-base sm:text-xl font-semibold">Tableau de bord</h2>
        </div>
        <div class="flex items-center gap-1 sm:gap-3">
          <button onclick="toggleDark()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
            <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
            <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
          </button>
          <div class="w-8 h-8 rounded-full bg-brand-600 flex items-center justify-center text-white text-xs font-bold">DZ</div>
        </div>
      </header>
      <div id="page-content" class="flex-1 overflow-y-auto p-3 sm:p-6"></div>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="invoice-preview" class="fixed inset-0 z-50 hidden bg-black/70 overflow-auto">
    <div class="min-h-full flex flex-col">
      <div class="sticky top-0 z-20 bg-white border-b shadow-sm px-3 py-3 flex items-center justify-between gap-2">
        <button onclick="closePreview()" class="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 font-medium text-sm">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> Retour
        </button>
        <span class="font-semibold text-sm text-slate-700 hidden sm:inline">Aperçu facture</span>
        <button onclick="downloadPDF()" class="flex items-center gap-1.5 px-3 py-2 bg-sky-600 text-white rounded-lg hover:bg-sky-700 text-sm font-medium">
          <i data-lucide="download" class="w-4 h-4"></i> PDF
        </button>
      </div>
      <div class="flex-1 p-3 sm:p-6 flex justify-center">
        <div class="w-full max-w-3xl bg-white rounded-xl shadow-xl overflow-hidden">
          <div id="invoice-render" class="bg-white"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initApp();
    });
    window.toggleSidebar = function() {
      state.sidebarOpen = !state.sidebarOpen;
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      if (sidebar) {
        if (state.sidebarOpen) {
          sidebar.classList.remove('-translate-x-full');
          sidebar.classList.add('translate-x-0');
          if (overlay) overlay.classList.remove('hidden');
        } else {
          sidebar.classList.add('-translate-x-full');
          sidebar.classList.remove('translate-x-0');
          if (overlay) overlay.classList.add('hidden');
        }
      }
    };
  </script>
</body>
</html>
