  <script>
    var LW = {
      fr:{t:"Vos données sont enregistrées dans ce navigateur uniquement.",
          b:"Si vous videz le cache de votre navigateur ou utilisez un autre appareil, vos factures seront perdues. Sauvegardez régulièrement avec Exporter (fichier .json) — c'est le seul format réimportable. Un PDF est une copie de facture, pas une sauvegarde.",
          c:"Exporter maintenant", h:"Plus tard"},
      ar:{t:"بياناتك محفوظة في هذا المتصفح فقط.",
          b:"إذا مسحت ذاكرة التخزين أو استخدمت جهازًا آخر، ستفقد فواتيرك. احفظ نسخة احتياطية بانتظام عبر «تصدير» (ملف .json) — وهو الصيغة الوحيدة القابلة للاستيراد. ملف PDF نسخة من الفاتورة وليس نسخة احتياطية.",
          c:"تصدير الآن", h:"لاحقًا"}
    };
    function paintWarn(){
      var l = (typeof locale !== 'undefined' && LW[locale]) ? locale : 'fr', d = LW[l];
      var q = function(id){ return document.getElementById(id); };
      if(q('lw-title')) q('lw-title').textContent = d.t;
      if(q('lw-body'))  q('lw-body').textContent  = d.b;
      if(q('lw-cta'))   q('lw-cta').textContent   = d.c;
      if(q('lw-hide'))  q('lw-hide').textContent  = d.h;
    }
    function dismissWarn(){
      var el = document.getElementById('local-warn');
      if(el) el.classList.add('hidden');
      try{ localStorage.setItem('fp_warn_seen','1'); }catch(e){}
    }
    (function(){
      var seen = false;
      try{ seen = localStorage.getItem('fp_warn_seen') === '1'; }catch(e){}
      if(!seen){
        var el = document.getElementById('local-warn');
        if(el) el.classList.remove('hidden');
      }
      paintWarn();
      window.addEventListener('load', function(){
        var t = window.toggleLocale;
        if(typeof t === 'function' && !t.__wrapped){
          window.toggleLocale = function(){ t.apply(null, arguments); paintWarn(); };
          window.toggleLocale.__wrapped = true;
        }
      });
    })();
  </script>
